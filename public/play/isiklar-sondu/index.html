<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lights Out</title>
<link rel="preload" href="./fonts/space-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./fonts.css">
<style>
  :root {
    --bg: #0d1328;
    --bg-deep: #070b18;
    --surface: #151d3a;
    --line: rgba(243, 234, 216, 0.12);
    --cream: #f3ead8;
    --text-2: #c9cbe0;
    --text-4: #8a8fb0;
    --accent: #ff6b2c;
    --led: #ffc23d;
    --red: #ff3b2f;
    --u: min(0.92vw, 1.6vh); /* 16:9 kutuya göre ölçek birimi */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--cream);
    font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }

  .app {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    gap: calc(var(--u) * 1.5);
    padding: calc(var(--u) * 2.2) calc(var(--u) * 3);
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255, 59, 47, var(--glow, 0)), transparent 60%),
      repeating-linear-gradient(-62deg, transparent 0 36px, rgba(243, 234, 216, 0.02) 36px 58px),
      var(--bg);
    touch-action: manipulation;
    cursor: pointer;
    transition: background 0.1s;
  }

  .top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .modes { display: flex; gap: calc(var(--u) * 0.8); }
  .mode {
    padding: calc(var(--u) * 0.8) calc(var(--u) * 1.8);
    font-size: max(10px, calc(var(--u) * 1.5)); letter-spacing: 0.14em;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; color: var(--text-2);
  }
  .mode[aria-pressed='true'] { color: #1a0d05; background: var(--accent); border-color: transparent; }
  .mode:disabled { opacity: 0.4; cursor: default; }
  .icon {
    width: max(30px, calc(var(--u) * 4.4)); height: max(30px, calc(var(--u) * 4.4));
    display: grid; place-items: center; padding: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 50%;
  }
  .icon svg { width: 55%; height: 55%; }
  .icon .cross, .icon[aria-pressed='true'] .wave { display: none; }
  .icon[aria-pressed='true'] .cross { display: inline; }

  /* Işık köprüsü */
  .gantry {
    position: relative;
    display: flex; gap: calc(var(--u) * 2.2);
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2.6);
    background: linear-gradient(#141a33, #0a0e1e);
    border-radius: calc(var(--u) * 1.6);
    box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(243, 234, 216, 0.08);
  }
  .gantry::before, .gantry::after {
    content: ''; position: absolute; top: -100vh; width: calc(var(--u) * 1); height: 100vh; background: #0a0e1e;
  }
  .gantry::before { left: 18%; }
  .gantry::after { right: 18%; }
  .pod {
    display: flex; flex-direction: column; gap: calc(var(--u) * 1.2);
    padding: calc(var(--u) * 1.2);
    background: #05070f; border-radius: calc(var(--u) * 1.2);
    box-shadow: inset 0 0 0 1px rgba(243, 234, 216, 0.06);
  }
  .lamp {
    width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a1414, #1a0606 70%);
    box-shadow: inset 0 0 0 calc(var(--u) * 0.4) #0d0303;
    transition: background 0.04s, box-shadow 0.04s;
  }
  .pod.on .lamp {
    background: radial-gradient(circle at 35% 30%, #ffd2c8, var(--red) 35%, #b3140c 75%);
    box-shadow: 0 0 calc(var(--u) * 3) rgba(255, 59, 47, 0.85), 0 0 calc(var(--u) * 8) rgba(255, 59, 47, 0.35);
  }
  .gantry.fault .pod .lamp { animation: fault 0.18s steps(2) 4; }
  @keyframes fault { 50% { background: radial-gradient(circle at 35% 30%, #ffe1a8, var(--led) 40%, #b37a0c 80%); } }

  /* Gösterge */
  .display { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.8); text-align: center; }
  .progress { font-size: max(10px, calc(var(--u) * 1.5)); letter-spacing: 0.24em; color: var(--text-4); min-height: 1.2em; }
  .time {
    font-size: calc(var(--u) * 10.5); line-height: 1; letter-spacing: 0.02em;
    color: var(--led); text-shadow: 0 0 calc(var(--u) * 3) rgba(255, 194, 61, 0.45);
    font-variant-numeric: tabular-nums;
  }
  .time.bad { color: var(--accent); text-shadow: 0 0 calc(var(--u) * 3) rgba(255, 107, 44, 0.5); }
  .time.dim { color: rgba(255, 194, 61, 0.25); text-shadow: none; }
  .msg {
    font-family: 'Archivo Variable', system-ui, sans-serif; font-style: italic; font-weight: 900; font-stretch: 125%;
    font-size: calc(var(--u) * 3.4); line-height: 1.1; min-height: 1.1em;
  }
  .msg.good { color: var(--led); }
  .msg.bad { color: var(--accent); }
  .sub { font-size: max(10px, calc(var(--u) * 1.5)); letter-spacing: 0.16em; color: var(--text-2); min-height: 1.2em; }
  .sub.blink { animation: blink 1.1s steps(2, start) infinite; color: var(--led); }
  @keyframes blink { to { visibility: hidden; } }

  /* Alt şerit: istatistik + geçmiş */
  .stats {
    width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: calc(var(--u) * 2);
    padding-top: calc(var(--u) * 1.2); border-top: 1px solid var(--line);
  }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat b { font-size: max(9px, calc(var(--u) * 1.2)); letter-spacing: 0.2em; color: var(--text-4); font-weight: 700; }
  .stat span { font-size: max(12px, calc(var(--u) * 2.4)); color: var(--cream); white-space: nowrap; }
  .history { flex: 1; max-width: calc(var(--u) * 40); height: calc(var(--u) * 6); display: flex; align-items: flex-end; gap: 3px; }
  .history i { flex: 1; min-width: 3px; border-radius: 2px 2px 0 0; background: rgba(255, 194, 61, 0.65); }
  .history i.bad { background: var(--accent); }
  .history i.last { background: var(--led); box-shadow: 0 0 8px rgba(255, 194, 61, 0.6); }

  @media (max-aspect-ratio: 1/1) {
    :root { --u: min(1.5vw, 0.9vh); }
    .history { display: none; }
  }
  /* gömülü küçük oynatıcı: istatistik şeridi sığmaz */
  @media (max-height: 300px) {
    .stats { display: none; }
    .app { justify-content: space-around; }
  }
  @media (prefers-reduced-motion: reduce) { .sub.blink, .gantry.fault .pod .lamp { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="modes" role="group">
      <button type="button" class="mode" data-mode="single" aria-pressed="true"></button>
      <button type="button" class="mode" data-mode="gp" aria-pressed="false"></button>
    </div>
    <button type="button" class="icon" id="btnSound" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="gantry" id="gantry" aria-hidden="true">
    <div class="pod"><i class="lamp"></i><i class="lamp"></i></div>
    <div class="pod"><i class="lamp"></i><i class="lamp"></i></div>
    <div class="pod"><i class="lamp"></i><i class="lamp"></i></div>
    <div class="pod"><i class="lamp"></i><i class="lamp"></i></div>
    <div class="pod"><i class="lamp"></i><i class="lamp"></i></div>
  </div>

  <div class="display" aria-live="polite">
    <div class="progress" id="progress"></div>
    <div class="time dim" id="time">0.000</div>
    <div class="msg" id="msg"></div>
    <div class="sub blink" id="sub"></div>
  </div>

  <footer class="stats">
    <div class="stat"><b id="lblBest"></b><span id="best">—</span></div>
    <div class="history" id="history" aria-hidden="true"></div>
    <div class="stat" style="text-align:right"><b id="lblAvg"></b><span id="avg">—</span></div>
  </footer>
</div>
<script src="./kit.js"></script>
<script src="./game.js"></script>
</body>
</html>
